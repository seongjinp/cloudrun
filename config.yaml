# gateway-cloudrun/config.yaml — GCP Cloud Run 배포용 모델 config
#
# model_info 자기선언 계약(2026-08-02 axagent 2축 재설계 — 정본은 axagent `gateway/config.yaml` 헤더):
#   family              이 엔트리가 속한 **제품 모델**(picker 항목·권한 주체·로그 차원). 생략 시
#                       model_name 자신이 family다. 여러 엔트리가 같은 family를 선언하면 picker에
#                       한 줄로 접히고 그 차이가 추론 수준이 된다. model_name은 전송 주소일 뿐이다.
#   family_label        picker/admin 표시명. 같은 family끼리 같은 값이어야 한다(불일치 = fail-loud).
#   reasoning_transport variant(수준별 엔트리 + reasoning_effort) | cli_effort(엔트리 1개 + CLI --effort)
#                       생략 = 추론 수준 미지원. claude CLI는 --effort를 claude-* 모델명에만 실으므로
#                       비-claude 모델은 variant가 유일한 경로다.
#   reasoning_level     [variant 필수] 이 엔트리의 수준. family가 low/medium/high를 정확히 다 덮어야 한다.
#   reasoning_levels    [cli_effort 필수] 지원 수준 목록.
#   ⚠ 옛 `description` 키는 제거됐다 — picker 설명 문구의 단일 출처는 axagent admin > 모델 탭(DB)다.
#
# **엔트리 순서 = picker 표시 순서다**(backend가 카탈로그 응답 순서를 그대로 쓴다).
model_list:
  # ── 사내 vLLM(prod 타겟) — Cloud Run에서는 사내망에 못 닿아 공개 NVIDIA 서빙으로 등록 ────────
  # 운영 게이트웨이(사내)는 vLLM을 직접 보지만 Cloud Run은 VPC 내부 IP에 도달할 수 없다. picker에
  # prod 기본 모델이 보여야 하므로 같은 모델의 공개 서빙으로 등록한다 — Cloud Run env에
  # LLM_API_KEY_NVIDIA_QWEN을 넣으면 dev에서도 실제 호출되고, 없으면 인증 오류로 빠르게 실패한다.
  # 추론 수준 미지원(reasoning_* 없음 — NVIDIA qwen 서빙의 thinking은 어댑터 결함으로 비활성 유지).
  - model_name: qwen-3.5
    litellm_params:
      model: hosted_vllm/qwen/qwen3.5-122b-a10b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/LLM_API_KEY_NVIDIA_QWEN
      additional_drop_params: ["output_config", "context_management"]
      max_tokens: 16384
    model_info:
      family_label: "Qwen 3.5"
      context_window: 262144
      max_input_tokens: 262144
      max_output_tokens: 16384
      compaction_ratio: 0.8
      strip_leading_reasoning: false

  # ── GCP Vertex AI — Gemini 3.8 Flash (한 family의 세 변형) ────────────────────────────────
  # reasoning_effort 무지정 엔트리는 두지 않는다 — Vertex 기본 thinkingLevel이 medium이라 -medium과
  # 동일 동작이다(gemini-3.6-flash 실측 근거를 그대로 적용).
  - model_name: gemini-3.8-flash-low
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "low"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-3.8-flash
      family_label: "Gemini 3.8 Flash"
      reasoning_transport: variant
      reasoning_level: low
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      cache_read_input_token_cost: 0.00000015
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  - model_name: gemini-3.8-flash-medium
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "medium"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-3.8-flash
      family_label: "Gemini 3.8 Flash"
      reasoning_transport: variant
      reasoning_level: medium
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      cache_read_input_token_cost: 0.00000015
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true
      default: true

  - model_name: gemini-3.8-flash-high
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "high"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-3.8-flash
      family_label: "Gemini 3.8 Flash"
      reasoning_transport: variant
      reasoning_level: high
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      cache_read_input_token_cost: 0.00000015
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  # ── GCP Vertex AI — Gemini 4 Argon (한 family의 세 변형) ──────────────────────────────────
  # 단가는 Vertex 가격 페이지의 정가(2026-12-01~, Global 입력 $4 · 캐시 $0.2 · 출력 $20 /1M — 2026-10-17 확인).
  # 11-30까지는 정가를 청구한 뒤 50%를 크레딧으로 돌려주는 프로모션이라 청구 단가표는 같다. 암시적 캐시만
  # 지원(명시적 캐시 미지원)이라 캐시 쓰기 단가는 없다. 추론 수준은 low/medium/high(기본 수준은 문서에
  # 없다 — 무지정 엔트리를 두지 않고 3.8과 같은 3변형으로 명시한다).
  - model_name: gemini-4-argon-low
    litellm_params:
      model: vertex_ai/gemini-4-argon
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "low"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-4-argon
      family_label: "Gemini 4 Argon"
      reasoning_transport: variant
      reasoning_level: low
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_read_input_token_cost: 0.0000002
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  - model_name: gemini-4-argon-medium
    litellm_params:
      model: vertex_ai/gemini-4-argon
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "medium"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-4-argon
      family_label: "Gemini 4 Argon"
      reasoning_transport: variant
      reasoning_level: medium
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_read_input_token_cost: 0.0000002
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  - model_name: gemini-4-argon-high
    litellm_params:
      model: vertex_ai/gemini-4-argon
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "high"
      # drop_params(true) + LITELLM_LOCAL_MODEL_COST_MAP는 벤더 코스트맵에 없는 모델을
      # supports_reasoning=False로 보고 reasoning_effort를 조용히 떨어뜨린다(실측). litellm이
      # 제공하는 강제 통과 목록으로 그 드롭을 막는다.
      allowed_openai_params: ["reasoning_effort"]
      max_tokens: 65536
    model_info:
      family: gemini-4-argon
      family_label: "Gemini 4 Argon"
      reasoning_transport: variant
      reasoning_level: high
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false

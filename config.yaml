      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 128000
    model_info:
      family_label: "Claude Haiku 5.5"
      reasoning_transport: cli_effort
      reasoning_levels: [low, medium, high]
      context_window: 1000000
      max_input_tokens: 1000000
      max_output_tokens: 128000
      compaction_ratio: 0.8
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_read_input_token_cost: 0.00000001
      cache_creation_input_token_cost: 0.000000125
      litellm_provider: "anthropic"
      mode: "chat"
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

litellm_settings:
  drop_params: true
  telemetry: false
  # 요청/응답 확인용 — 확인 끝나면 되돌릴 것(프롬프트 내용까지 로그에 찍힘).
  set_verbose: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

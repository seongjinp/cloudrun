# gateway-cloudrun/config.yaml — GCP Cloud Run 배포용 모델 config
model_list:
  # ── GCP Vertex AI — Claude 2종(effort는 CLI 네이티브, 추가 처리 불요) ─────────
  - model_name: claude-sonnet-5
    litellm_params:
      model: vertex_ai/claude-sonnet-5
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      max_tokens: 128000
    model_info:
      display_name: "Claude Sonnet 5"
      description: "GCP Vertex AI"
      context_window: 1000000
      max_input_tokens: 1000000
      max_output_tokens: 128000
      compaction_ratio: 0.8
      strip_leading_reasoning: false

  - model_name: claude-opus-4-8
    litellm_params:
      model: vertex_ai/claude-opus-4-8
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      max_tokens: 128000
    model_info:
      display_name: "Claude Opus 4.8"
      description: "GCP Vertex AI"
      context_window: 1000000
      max_input_tokens: 1000000
      max_output_tokens: 128000
      compaction_ratio: 0.8
      strip_leading_reasoning: false

  # ── GCP Vertex AI — Gemini 3.5 Flash Lite (GA, text-only generation) ───────────
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: vertex_ai/gemini-3.5-flash-lite
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      max_tokens: 65536
    model_info:
      display_name: "Gemini 3.5 Lite"
      description: "Gemini 3.5 Flash Lite"
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025
      cache_read_input_token_cost: 0.00000003
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  # ── GCP Vertex AI — Gemini ────────────────────────────────────────────────────
  # reasoning_effort 무지정 엔트리는 두지 않는다 — Vertex의 gemini-3.6-flash 기본 thinkingLevel이
  # medium이라 -medium과 동일 동작이다(2026-08-02 실측: 무지정 722토큰 vs medium 790토큰, 같은
  # 프롬프트·같은 정답). 수준은 -low/-medium/-high로만 노출한다.
  - model_name: gemini-3.6-flash-low
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "low"
      max_tokens: 65536
    model_info:
      display_name: "Gemini 3.6 Low"
      description: "Gemini 3.6 Flash Low Reasoning"
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

  - model_name: gemini-3.6-flash-medium
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "medium"
      max_tokens: 65536
    model_info:
      display_name: "Gemini 3.6 Medium"
      description: "Gemini 3.6 Flash Medium Reasoning"
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true
      default: true

  - model_name: gemini-3.6-flash-high
    litellm_params:
      model: vertex_ai/gemini-3.6-flash
      vertex_project: os.environ/VERTEX_AI_PROJECT
      vertex_location: os.environ/VERTEX_AI_LOCATION
      additional_drop_params: ["output_config", "context_management"]
      reasoning_effort: "high"
      max_tokens: 65536
    model_info:
      display_name: "Gemini 3.6 High"
      description: "Gemini 3.6 Flash High Reasoning"
      context_window: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 65536
      strip_leading_reasoning: false
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000075
      litellm_provider: "vertex_ai"
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: true
      supports_system_messages: true
      supports_tool_choice: true

litellm_settings:
  drop_params: true
  telemetry: false
  # 요청/응답 확인용 — 확인 끝나면 되돌릴 것(프롬프트 내용까지 로그에 찍힘).
  set_verbose: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "poc" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master")'
      when: always
    - when: never

stages:
  - build-base
  - build-app
  - deploy
  
image: asia-northeast3-docker.pkg.dev/pjt-prd-lgcaip-cicd/ar-prd-lgcaip-cicd-runner/gcloud-sdk:latest

build-base-dev:
  stage: build-base
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - dockerfile-baseimage
        - requirements.txt
  script:
    - echo $DEV_SERVICE_ACCOUNT_KEY > /tmp/sa-key.json
    # Docker 빌드
    - docker build --secret id=sa_key,src=/tmp/sa-key.json -t $DEV_DOCKER_REGISTRY/back-baseimage:latest -f dockerfile-baseimage .
    # Artifact Registry로 푸시
    - docker push $DEV_DOCKER_REGISTRY/back-baseimage:latest
    - docker rmi $DEV_DOCKER_REGISTRY/back-baseimage:latest
    - rm /tmp/sa-key.json

  after_script:
    # 빌드 실패해도 임시 파일 삭제
    - rm -f /tmp/sa-key.json
    
build-app-dev:
  stage: build-app
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - dockerfile-baseimage
        - "**/*"
  script:
    # Docker 빌드
    - docker build -t $DEV_DOCKER_REGISTRY/backend:$CI_COMMIT_SHA -f dockerfile --build-arg imagepath="$DEV_DOCKER_REGISTRY" -f dockerfile .
    - |
      USER=$(docker inspect --format={{.Config.User}} $DEV_DOCKER_REGISTRY/backend:$CI_COMMIT_SHA)
      if [ -z "$USER" ] || [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
        echo "이미지가 root 사용자를 사용하고 있습니다. 보안상의 이유로 이미지 푸시를 거부합니다."
        exit 1
      else
        echo "이미지가 비루트 사용자($USER)를 사용하고 있습니다. 보안 검사 통과."
      fi
    # Artifact Registry로 푸시
    - docker push $DEV_DOCKER_REGISTRY/backend:$CI_COMMIT_SHA
  after_script:
    # 빌드 실패해도 임시 파일 삭제
    - docker rmi $DEV_DOCKER_REGISTRY/backend:$CI_COMMIT_SHA

deploy-dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
      - dockerfile-baseimage
      - "**/*"
  script:
    - echo $DEV_SERVICE_ACCOUNT_KEY > /tmp/sa-key.json
    - gcloud auth activate-service-account --key-file=/tmp/sa-key.json
    # LITELLM_MASTER_KEY/DATABASE_URL/LLM_API_KEY_QWEN은 소스에 두지 않고 GitLab CI/CD Variables
    # (DEV_LITELLM_MASTER_KEY 등, masked)에서만 주입한다 — Settings > CI/CD > Variables에 등록 필요.
    - gcloud run deploy $DEV_RUN_NAME_BACKEND --image=$DEV_DOCKER_REGISTRY/backend:$CI_COMMIT_SHA --region=asia-northeast3 --project=$DEV_GCP_PROJECT --set-env-vars="LITELLM_MASTER_KEY=$DEV_LITELLM_MASTER_KEY,DATABASE_URL=$DEV_DATABASE_URL,LLM_API_KEY_QWEN=$DEV_LLM_API_KEY_QWEN"
    - rm /tmp/sa-key.json

  after_script:
    # 빌드 실패해도 임시 파일 삭제
    - rm -f /tmp/sa-key.json

# `gcloud builds submit --config=cloudbuild.yaml`용. 파일명이 소문자 `dockerfile`이라 `--tag` 단축형을
# 못 쓴다(그건 `Dockerfile`만 찾는다). 새 프로젝트는 기본 Compute SA에 역할이 없어 빌드가 403으로
# 막히므로 전용 SA(`cloudbuild-builder`, roles/cloudbuild.builds.builder)로 돌린다 — 사용자 지정 SA는
# 로그 버킷 지정이 필수라 CLOUD_LOGGING_ONLY.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "dockerfile", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/$PROJECT_ID/serviceAccounts/cloudbuild-builder@$PROJECT_ID.iam.gserviceaccount.com
